name: CI / CD Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

  deploy:
    name: Auto Deploy to Ubuntu Server (CD)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IP }}
          username: ubuntu
          password: ${{ secrets.IP_ENTRY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            echo "==> [Manageo CD] Starting automated deployment..."

            # 1. Source user environment safely without failing if files do not exist
            if [ -f "$HOME/.profile" ]; then
              . "$HOME/.profile" 2>/dev/null || true
            fi
            if [ -f "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc" 2>/dev/null || true
            fi
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$HOME/.nvm/nvm.sh" 2>/dev/null || true
            fi

            # 2. Add possible node and pm2 paths to PATH
            if [ -d "$HOME/.nvm/versions/node" ]; then
              LATEST_NVM_BIN=$(find "$HOME/.nvm/versions/node" -maxdepth 2 -type d -name "bin" 2>/dev/null | sort -V | tail -n 1)
              if [ -n "$LATEST_NVM_BIN" ]; then
                export PATH="$LATEST_NVM_BIN:$PATH"
              fi
            fi
            export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            echo "==> [Environment]"
            echo "User: $(whoami)"
            echo "Node: $(command -v node >/dev/null 2>&1 && node -v || echo 'Not found')"
            echo "NPM:  $(command -v npm >/dev/null 2>&1 && npm -v || echo 'Not found')"
            echo "PM2:  $(command -v pm2 >/dev/null 2>&1 && pm2 -v || echo 'Not found')"

            # 3. Locate or clone project directory
            echo "==> [Manageo CD] Locating project directory..."
            TARGET_DIR=""
            for dir in "$HOME/manageo/task-reminder" "/home/ubuntu/manageo/task-reminder" "$HOME/task-reminder" "/home/ubuntu/task-reminder"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              echo "Standard path not found, searching in $HOME..."
              TARGET_DIR=$(find "$HOME" -maxdepth 3 -type d -name "task-reminder" 2>/dev/null | head -n 1)
            fi

            if [ -z "$TARGET_DIR" ]; then
              echo "Repository not found on server. Creating $HOME/manageo and cloning repository..."
              mkdir -p "$HOME/manageo"
              cd "$HOME/manageo"
              git clone https://github.com/Arafat-Rahman-603/task-reminder.git
              TARGET_DIR="$HOME/manageo/task-reminder"
            fi

            cd "$TARGET_DIR"
            echo "==> [Manageo CD] Deploying in directory: $(pwd)"

            # 4. Git pull latest code
            echo "==> [Manageo CD] Pulling latest changes from main..."
            git fetch origin main
            git checkout main 2>/dev/null || true
            git reset --hard origin/main

            # 5. Dependencies & Build
            echo "==> [Manageo CD] Installing dependencies..."
            npm install --legacy-peer-deps

            echo "==> [Manageo CD] Building Next.js production bundle..."
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            # 6. PM2 Process Reload
            echo "==> [Manageo CD] Reloading PM2 process..."
            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe manageo >/dev/null 2>&1; then
                pm2 reload manageo --update-env || pm2 restart manageo --update-env
              elif pm2 describe task-reminder >/dev/null 2>&1; then
                pm2 reload task-reminder --update-env || pm2 restart task-reminder --update-env
              else
                echo "Starting new PM2 process 'manageo'..."
                pm2 start npm --name "manageo" -- start
              fi
              pm2 save || true
            elif [ -f "./node_modules/.bin/pm2" ]; then
              ./node_modules/.bin/pm2 reload manageo || ./node_modules/.bin/pm2 start npm --name "manageo" -- start || true
            else
              echo "PM2 not found globally, using npx pm2..."
              npx pm2 reload manageo || npx pm2 start npm --name "manageo" -- start || true
            fi

            echo "==> [Manageo CD] Deployment successfully completed!"
